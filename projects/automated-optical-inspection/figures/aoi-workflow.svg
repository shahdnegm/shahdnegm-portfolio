<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="570" viewBox="0 0 1120 570" role="img" aria-label="AOI inspection system architecture">
<rect width="1120" height="570" fill="#f8fafc"/>
<text x="50" y="56" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#12243a">Single-Camera Automated Optical Inspection</text>
<text x="50" y="88" font-family="Arial,sans-serif" font-size="16" fill="#52657d">System overview redrawn from Shahd Negm's BSc thesis (2025), Sections 2.1–2.10</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#547391" stroke-width="1.5"/></marker></defs>
<g font-family="Arial,sans-serif" font-size="17" text-anchor="middle" fill="#14253d">
<rect x="50" y="140" width="190" height="95" rx="12" fill="#dceafe" stroke="#7ca5da"/><text x="145" y="175" font-weight="bold">Bottle detected</text><text x="145" y="201" font-size="14">Sensor trigger</text>
<rect x="315" y="140" width="205" height="95" rx="12" fill="#dceafe" stroke="#7ca5da"/><text x="417" y="172" font-weight="bold">Image acquisition</text><text x="417" y="198" font-size="14">USB camera + ring light</text><text x="417" y="218" font-size="14">45° mirror</text>
<rect x="595" y="140" width="210" height="95" rx="12" fill="#d9f4eb" stroke="#6ebfa4"/><text x="700" y="172" font-weight="bold">YOLOv8</text><text x="700" y="197" font-size="14">SKU + region selection</text><text x="700" y="217" font-size="14">JSON calibration</text>
<rect x="845" y="140" width="225" height="95" rx="12" fill="#eee6fd" stroke="#ad94d7"/><text x="958" y="168" font-weight="bold">Inspection modules</text><text x="958" y="190" font-size="13">Cap • Label • Color</text><text x="958" y="209" font-size="13">OCR • Volume • Shape</text>
<rect x="845" y="310" width="225" height="80" rx="12" fill="#ffeccf" stroke="#d9ae70"/><text x="958" y="340" font-weight="bold">Quality decision</text><text x="958" y="366" font-size="14">Bottle-level OK / NG</text>
<rect x="500" y="310" width="255" height="80" rx="12" fill="#dcf3f6" stroke="#83bfc7"/><text x="627" y="340" font-weight="bold">Traceability output</text><text x="627" y="365" font-size="14">Excel log + alerts</text>
<rect x="140" y="310" width="250" height="80" rx="12" fill="#f7e2e7" stroke="#d79eab"/><text x="265" y="339" font-weight="bold">Rejection subsystem</text><text x="265" y="364" font-size="14">PLC + pneumatic pusher</text>
</g>
<g stroke="#547391" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M240 187 H315"/><path d="M520 187 H595"/><path d="M805 187 H845"/><path d="M958 235 V310"/><path d="M845 350 H755"/><path d="M500 350 H390"/></g>
<text x="50" y="465" font-family="Arial,sans-serif" font-size="17" fill="#334c67">The prototype thesis describes computer-vision inspection, per-bottle records and PLC timing logic.</text>
<text x="50" y="496" font-family="Arial,sans-serif" font-size="15" fill="#52657d">Diagram is illustrative; not a screenshot of a production MES or independently validated plant deployment.</text>
<text x="50" y="535" font-family="Arial,sans-serif" font-size="14" fill="#52657d">Source: Shahd Negm, Vision Based Automated Optical Inspection for Real Time Quality Control (BSc thesis, 2025).</text>
</svg>